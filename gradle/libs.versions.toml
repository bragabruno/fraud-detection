[versions]
# Core framework versions
springBoot = "3.3.4"
springDependencyManagement = "1.1.4"
springframeworkSecurity = "6.3.1"

# Libraries
lombok = "1.18.30"
jacksonCore = "2.16.0"
jakartaValidation = "3.0.2"
jjwt = "0.12.3"
springdocOpenapi = "2.3.0"
caffeine = "3.1.8"
flowable = "7.0.0"

# Integration libraries
plaidJava = "16.6.0"

# Machine Learning and Data Science
tensorflow = "0.5.0"
deeplearning4j = "1.0.0-M1.1"
nd4j = "1.0.0-M1.1"
commonsMath = "3.6.1"
smile = "2.6.0"
neo4j = "4.0.5"

# Messaging and Streaming
kafka = "3.6.0"
springKafka = "3.1.0"
flink = "1.17.0"

# Database
postgresql = "42.6.0"
h2 = "2.2.224"

# Testing
junit = "5.11.3"
mockito = "5.10.0"

[libraries]
# Spring Boot
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version.ref = "springframeworkSecurity" }

# Jackson
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonCore" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jacksonCore" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jacksonCore" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Validation
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakartaValidation" }

# API Documentation
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }

# Security
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Integration libraries
plaid-java = { module = "com.plaid:plaid-java", version.ref = "plaidJava" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
flowable-spring-boot = { module = "org.flowable:flowable-spring-boot-starter", version.ref = "flowable" }

# Machine Learning and Data Science
tensorflow-core-platform = { module = "org.tensorflow:tensorflow-core-platform", version.ref = "tensorflow" }
deeplearning4j-core = { module = "org.deeplearning4j:deeplearning4j-core", version.ref = "deeplearning4j" }
nd4j-native-platform = { module = "org.nd4j:nd4j-native-platform", version.ref = "nd4j" }
commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commonsMath" }
smile-core = { module = "com.github.haifengl:smile-core", version.ref = "smile" }
neo4j-ogm-core = { module = "org.neo4j:neo4j-ogm-core", version.ref = "neo4j" }
neo4j-ogm-bolt-driver = { module = "org.neo4j:neo4j-ogm-bolt-driver", version.ref = "neo4j" }

# Messaging and Streaming
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
kafka-streams = { module = "org.apache.kafka:kafka-streams", version.ref = "kafka" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "springKafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test", version.ref = "springKafka" }
flink-streaming-java = { module = "org.apache.flink:flink-streaming-java", version.ref = "flink" }
flink-clients = { module = "org.apache.flink:flink-clients", version.ref = "flink" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }

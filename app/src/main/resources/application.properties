# Configure H2 in-memory database for development
spring.datasource.url=jdbc:h2:mem:frauddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Application settings
spring.application.name=fraud-detection

# Plaid API configuration
# Replace these with actual values in production environment
plaid.client-id=${PLAID_CLIENT_ID:your_client_id_here}
plaid.secret=${PLAID_SECRET:your_secret_here}
plaid.environment=sandbox
plaid.client-name=Fraud Detection System
plaid.country-codes=US
plaid.language=en
